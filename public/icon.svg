<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Brand Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Subtle Inner Border Highlight -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Badge Background Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7C2D12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Center Graphic: POS Terminal & Ticket Symbol -->
  <g filter="url(#softShadow)">
    <!-- Digital Receipt Arc -->
    <path d="M196 110 H316 C322 110 326 114 326 120 V145 H186 V120 C186 114 190 110 196 110 Z" fill="#FFFFFF" fill-opacity="0.85"/>
    <circle cx="216" cy="128" r="4" fill="#EA580C"/>
    <circle cx="236" cy="128" r="4" fill="#EA580C"/>
    <circle cx="256" cy="128" r="4" fill="#EA580C"/>
    <circle cx="276" cy="128" r="4" fill="#EA580C"/>
    <circle cx="296" cy="128" r="4" fill="#EA580C"/>

    <!-- Main Bold Monogram "POS" -->
    <text x="256" y="275" 
          font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="140" 
          letter-spacing="4" 
          fill="#FFFFFF" 
          text-anchor="middle" 
          alignment-baseline="middle">POS</text>

    <!-- Subtitle Pill Badge: "EVENT SYSTEM" -->
    <rect x="116" y="340" width="280" height="56" rx="28" fill="url(#badgeGrad)" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"/>
    
    <text x="256" y="375" 
          font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" 
          font-weight="800" 
          font-size="24" 
          letter-spacing="5" 
          fill="#FFFFFF" 
          text-anchor="middle" 
          alignment-baseline="middle">EVENT SYSTEM</text>
  </g>
</svg>
